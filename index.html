<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodzina Mińczyńskich</title>
<meta name="description" content="Strona rodzinna Mińczyńskich – dyżury domowe i inne wspólne sprawy.">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/img/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  // Ustaw klasę "authed" jak najwcześniej, żeby uniknąć błysku
  // zalogowanej treści przed jej ukryciem (i odwrotnie).
  document.documentElement.classList.toggle(
    "authed",
    !!localStorage.getItem("minczynscy_user")
  );
</script>
</head>
<body>

<div id="login-gate" class="login-gate">
  <div class="login-card">
    <img class="login-icon" src="assets/img/logo-header.png" alt="Mińczyńscy">
    <h1>Mińczyńscy</h1>
    <p>Zaloguj się kontem Google, żeby zobaczyć stronę rodzinną.</p>
    <div id="g_id_signin" class="g_id_signin"></div>
    <p id="login-error" class="login-error" hidden></p>
  </div>
</div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#top">
      <img class="brand-logo" src="assets/img/logo-header.png" alt="">
      Mińczyńscy
    </a>
    <div class="header-right">
      <nav class="site-nav">
        <a href="#duty">Dyżury</a>
      </nav>
      <div id="user-badge" class="user-badge">
        <img id="user-avatar" class="user-avatar" alt="">
        <span id="user-name"></span>
        <button id="logout-btn" class="logout-btn" type="button">Wyloguj</button>
      </div>
    </div>
  </div>
</header>

<main id="top">
  <section id="duty" class="duty-section wrap">
    <div class="duty-heading">
      <h1>Dyżury domowe</h1>
      <p class="subtitle">Kto dziś dba o kuchnię, śmieci i sprzątanie?</p>
    </div>

    <div class="mode-toggle-card">
      <div class="mode-toggle-text">
        <strong>Tryb wakacyjny</strong>
        <span id="mode-description">obowiązki zmieniają się co tydzień</span>
      </div>
      <label class="switch" for="vacation-toggle">
        <input type="checkbox" id="vacation-toggle">
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>

    <div class="today-label">
      <span id="today-date"></span>
    </div>

    <div id="duty-cards" class="duty-cards"></div>

    <div class="preview">
      <h2>Podgląd na kolejne dni</h2>
      <div class="table-scroll">
        <table id="preview-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>🍳 Kuchnia</th>
              <th>🗑️ Śmieci</th>
              <th>🧹 Sprzątanie</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">Rodzina Mińczyńskich</div>
</footer>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
